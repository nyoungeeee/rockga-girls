<style>
:root{
  --paper:color-mix(in srgb,var(--accent) 5%,#F8F9FB); --surface:#FFFFFF; --ink:#0F1E3D; --ink2:#5B6C8F; --rule:#E1E9F5; --rule2:#BCCAE2;
  --accent:var(--acc-l,#2B5BE0); --soft:color-mix(in srgb,var(--accent) 11%,#fff); --on-accent:#FFFFFF; --rest:#1594BE; --warn:#D2453A; --soon:#B26B00; --blend:multiply; --hl:.85;
  --shadow:0 1px 2px rgba(20,48,120,.05),0 10px 30px rgba(20,48,120,.07);
  --serif:"Outfit","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0A1120; --surface:#111A2E; --ink:#E8EEFB; --ink2:#93A4C6; --rule:#1E2A46; --rule2:#35476F;
  --accent:var(--acc-d,#7CA4FF); --soft:color-mix(in srgb,var(--accent) 16%,#111A2E); --on-accent:#0A1120; --rest:#5CC4E6; --warn:#FF8A7A; --soon:#F5B84B; --blend:normal; --hl:.82;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); } }
:root[data-theme="dark"]{
  --paper:#0A1120; --surface:#111A2E; --ink:#E8EEFB; --ink2:#93A4C6; --rule:#1E2A46; --rule2:#35476F;
  --accent:var(--acc-d,#7CA4FF); --soft:color-mix(in srgb,var(--accent) 16%,#111A2E); --on-accent:#0A1120; --rest:#5CC4E6; --warn:#FF8A7A; --soon:#F5B84B; --blend:normal; --hl:.82;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface);border:1px solid var(--rule2);border-radius:10px;padding:.4em .95em;min-height:38px;font-weight:500;transition:background .15s,border-color .15s,color .15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.primary:hover{color:var(--on-accent);filter:brightness(1.08)}
button.quiet{background:none;border-color:transparent;color:var(--ink2);padding:.3em .55em}
button.quiet:hover{color:var(--accent);background:var(--soft);border-color:transparent}
button.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
button.danger:hover{color:var(--warn);border-color:var(--warn)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--rule2);border-radius:10px;padding:.35em .65em;min-height:38px;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:3px solid color-mix(in srgb,var(--accent) 22%,transparent);outline-offset:0}
input[type=checkbox]{min-height:0;width:18px;height:18px;accent-color:var(--accent)}
input[type=number]{width:5.2em}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.1rem} h3{font-size:1rem}
.muted{color:var(--ink2)} .small{font-size:.84rem} .num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 80%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--rule);
  display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.6rem 1rem}
.top h1{font-size:1.1rem;font-weight:700;margin-right:auto;display:flex;align-items:center;gap:.5rem}
.logo{width:1.45em;height:1.45em;flex:none}
.by{font:400 .72rem var(--sans);color:var(--ink2);letter-spacing:.03em;align-self:flex-end;padding-bottom:.18em;white-space:nowrap}
.by-foot{display:none;text-align:center;font-size:.72rem;letter-spacing:.03em;color:var(--ink2);padding:0 1rem 1.5rem}
@media (max-width:520px){.by{display:none}.by-foot{display:block}}
.tabs{display:flex;gap:.2rem;order:3;width:100%;background:var(--soft);padding:3px;border-radius:12px}
.tabs button{background:none;border:0;border-radius:9px;flex:1;color:var(--ink2);padding:.25em .2em;min-height:34px}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(20,48,120,.14)}
#sync{font-size:.8rem;border:0;background:none;color:var(--ink2);min-height:0;padding:.2em 0;font-weight:400}
#sync::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--rule2);margin-right:.4em}
#sync[data-s=synced]::before{background:var(--rest)} #sync[data-s=error]::before{background:var(--warn)}
main{max-width:1080px;margin:0 auto;padding:1.1rem 1rem 2rem}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:1.15rem;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.stack>*+*{margin-top:1rem}
.sp{margin-left:auto}

/* 오늘 */
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .8rem;margin-bottom:.9rem}
.dayhead .date{font:700 1.6rem/1.2 var(--serif);letter-spacing:-.02em}
.goal{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:.5rem}
.goal i{display:block;height:100%;background:linear-gradient(90deg,var(--g3,#4F8BF7),var(--accent));border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{background:var(--soft);color:var(--accent);border-radius:99px;padding:.12em .75em;font-size:.82rem;font-weight:500}
.today{display:grid;gap:1rem}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px}
.seg button{background:none;border:0;border-radius:99px;min-height:30px;padding:.15em 1em;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}

/* 타이머: 화면에서 유일하게 색을 채운 카드 */
.timer{text-align:center;border:0;color:#fff;background:linear-gradient(160deg,var(--g1,#1B378F),var(--g2,#2B5BE0) 55%,var(--g3,#4F8BF7));box-shadow:0 14px 34px color-mix(in srgb,var(--g2,#2B5BE0) 32%,transparent);transition:background .4s}
.timer[data-rest]{background:linear-gradient(160deg,var(--r1,#0C5874),var(--r2,#1594BE) 55%,var(--r3,#4CC3E3));box-shadow:0 14px 34px color-mix(in srgb,var(--r2,#1594BE) 30%,transparent)}
.timer .seg{background:rgba(255,255,255,.16)}
.timer .seg button,.timer .seg button:hover{background:none;color:rgba(255,255,255,.8)}
.timer .seg button[aria-pressed=true]{background:#fff;color:var(--g1,#1B378F)}
.ring{position:relative;width:min(264px,74vw);aspect-ratio:1;margin:1.1rem auto .9rem}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.2)}
.ring .fg{stroke:#fff;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem}
.phase{margin:0;font-weight:500;font-size:.92rem;color:rgba(255,255,255,.85)}
.digits{font:600 clamp(3rem,15vw,3.9rem)/1 var(--serif);letter-spacing:-.02em}
.digits .d{display:inline-block;width:.6em;text-align:center}
.timer[data-sw] .digits{font-size:clamp(2.3rem,11.5vw,2.9rem)}
.dots{display:flex;gap:.4rem;justify-content:center;min-height:9px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.on{background:#fff}
.pick{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:0 0 1rem}
.pick label{display:flex;align-items:center;gap:.4rem;font-size:.84rem;color:rgba(255,255,255,.85)}
.pick select{max-width:11rem}
.timer select,.timer input[type=text]{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.timer select option{color:#0F1E3D;background:#fff}
.timer input::placeholder{color:rgba(255,255,255,.65)}
.timer select:focus,.timer input:focus{border-color:#fff;outline-color:rgba(255,255,255,.3)}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.timer button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff}
.timer button:hover{background:rgba(255,255,255,.24);border-color:#fff;color:#fff}
.timer .btns .primary{min-width:8rem;min-height:46px;border-radius:99px;background:#fff;border-color:#fff;color:var(--g1,#1B378F);filter:none}
.timer[data-rest] .btns .primary,.timer[data-rest] .seg button[aria-pressed=true]{color:var(--r1,#0C5874)}
.timer .btns button{border-radius:99px}
.timer button.quiet{background:none;border-color:transparent;color:rgba(255,255,255,.85)}
.timer :focus-visible{outline-color:#fff}
.last{margin-top:1.1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.25);text-align:left}
.last .muted{color:rgba(255,255,255,.8)}
.rate{display:inline-flex;gap:.3rem}
.rate button{min-height:32px;width:32px;padding:0;border-radius:50%}
.rate button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.timer .rate button[aria-pressed=true]{background:#fff;color:var(--g1,#1B378F);border-color:#fff}

.tasks{list-style:none;margin:.4rem 0;padding:0}
.tasks li{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--rule)}
.tasks .t{flex:1;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:flex-start;gap:.2rem}

/* 텐미닛 타임테이블 */
.tt{user-select:none;-webkit-user-select:none}

.tt-head + .tt-row .track{border-top:1px solid var(--rule2);border-top-right-radius:8px}
.tt-row:last-child .track{border-bottom-color:var(--rule2);border-bottom-right-radius:8px}
.cell{border-right:1px solid var(--rule);cursor:cell}
.cell:hover{background:var(--soft)}
.cell:nth-child(3){border-right-color:var(--rule2)} .cell:nth-child(6){border-right-color:var(--rule2)}
.cell.sel{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.bar{position:absolute;top:4px;bottom:4px;border-radius:5px;background:var(--c);opacity:var(--hl);mix-blend-mode:var(--blend);border:0;padding:0;min-height:0;cursor:pointer}

.fix{position:absolute;top:1px;bottom:1px;border:1px dashed var(--rule2);border-radius:5px;pointer-events:none;overflow:hidden;
  background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--accent) 12%,transparent) 5px 6px);
  font-size:.68rem;line-height:24px;padding-left:5px;color:var(--ink2);white-space:nowrap}

/* 통계 */

.heat i{border-radius:4px;background:var(--soft)}

.dayb{min-height:32px;padding:0 .55em} .dayb[aria-pressed=true],.dayb[aria-pressed=true]:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
mark{background:color-mix(in srgb,var(--accent) 26%,transparent);color:inherit;border-radius:3px;padding:0 1px}

button.chip{border:0;min-height:0;cursor:pointer} button.chip:hover{background:var(--accent);color:var(--on-accent)}

span.chipb{cursor:default}
.ev.fxw{border-left:0;background:color-mix(in srgb,var(--c) 30%,transparent);color:var(--ink)}

    if(m>S.settings.m){S.settings={m,v:clone(data.v||{})}; changed=true} else if(m<S.settings.m) need=true;

function restoreDay(e,date){ // 쉬는 날을 다시 넣기: 기간 쉬기 안이면 그 날만 따로 살리고, 하루 쉬기였다면 쉬기를 지움
  const base=e.base||e; if(e.brk) put('schedx',{id:base.id+'@'+date,ev:base.id,date,on:true}); else if(e.xid) del('schedx',e.xid);
  render(); toast('이 날 다시 넣었어요');
}
function dropOn(b,fromDate){ // 기간 쉬기를 지우거나 줄일 때, 그 안에서 따로 살려 둔 날들도 함께 정리

    sec('설정',['타이머의 집중·휴식 시간, 카테고리별 목표, 하루가 시작되는 시각을 정해요.','카테고리와 항목을 추가하거나 이름과 색을 바꿔요. 안 쓰는 것은 "보관"하면 선택 목록에서 빠지고 기록은 남아요.','맨 아래 "저장"에서 데이터 폴더를 연결하거나 백업 파일을 내보내고 가져와요.']),
    sec('폰에서 쓰기',['아이폰에서는 파일 앱이 아니라 웹 주소(Claude 링크 등)로 열어야 작동해요.','타이머가 도는 동안은 설정의 "화면 켜 두기"로 화면이 꺼지지 않게 해요. 화면을 잠그면 알림음은 나지 않지만, 다시 열면 지난 시간이 정확히 기록돼요.','아래쪽 탭으로 화면을 옮겨요. 폴더 저장은 PC의 Chrome이나 Edge에서만 돼요.']),
    sec('검색과 저장',['위쪽 "검색"은 일기, 메모, 할 일, 일정, 회고를 한꺼번에 찾아요.','위쪽 오른쪽 끝에 지금 기록이 어디에 저장되는지 표시돼요. "다시 연결 필요"라고 나오면 화면을 아무 곳이나 누르거나 그 글자를 누르세요. 크롬이 물을 때 "방문할 때마다 허용"을 고르면 다음부터 묻지 않아요.','다시 연결하기 전에 한 기록도 사라지지 않아요. 브라우저에 저장돼 있다가 연결하는 순간 폴더 파일에 반영돼요.','다른 PC에서 이어 쓰려면 데이터 폴더를 통째로 옮긴 뒤 그 폴더를 연결하면 돼요.'])),
    [h('button',{style:'margin-right:auto',onclick:()=>onboard(0)},'시작 안내 다시 보기'),h('button',{class:'primary',onclick:closeDlg},'닫기')],true);
}
$('#help').onclick=helpDlg;

/* ---------- 꾸밈: 탭·카드 제목 아이콘, 빈 화면 그림 ---------- */
const TABIC={today:'sun',stats:'chart',plan:'table',cal:'cal',diary:'book',set:'gear'};
document.querySelectorAll('.tabs button').forEach(b=>b.prepend(ic(TABIC[b.dataset.v]))); $('#find').prepend(ic('search'));
const H2IC=[['할 일','list'],['일정','bell'],['타임테이블','rows'],['목표별','target'],['주간 회고','pen'],['카테고리별','pie'],['시간대별','clock'],['최근 22주','grid'],['기록','rows'],['주간 시간표','table'],['D-day','flag'],
  ['지난 일기','book'],['화면','palette'],['타이머','clock'],['목표와 하루 기준','target'],['카테고리와 항목','tag'],['저장','folder'],['아직 기록이 없어요','spark']];
function decorate(){
  document.querySelectorAll('main h2:not([data-ic])').forEach(el=>{el.dataset.ic='1'; const t=el.textContent, m=H2IC.find(x=>x[0]===t), n=m?m[1]:/항목별$/.test(t)?'tag':/요일$/.test(t)?'cal':''; if(n) el.prepend(h('span',{class:'ib'},ic(n)))});
  document.querySelectorAll('main .empty.art:not([data-ic])').forEach(el=>{el.dataset.ic='1'; const t=el.textContent; el.prepend(h('span',{class:'artic'},ic(t.indexOf('할 일')>=0?'list':t.indexOf('고정 일정')>=0?'table':'book')))});
}
new MutationObserver(decorate).observe($('main'),{childList:true,subtree:true});

/* ---------- 화면 전환 ---------- */
let view='today', enterT=null;
function enter(v){const sec=$('#v-'+v); sec.classList.remove('enter'); void sec.offsetWidth; sec.classList.add('enter'); clearTimeout(enterT); enterT=setTimeout(()=>sec.classList.remove('enter'),900)}
const R={today:renderToday,stats:renderStats,plan:renderPlan,cal:renderCal,diary:renderDiary,set:renderSet};
function render(){applyLook(); R[view]()}
document.querySelector('.tabs').addEventListener('click',e=>{const v=e.target.dataset.v; if(!v) return; jFlush(); rvFlush(); view=v;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===v)));
  ['today','stats','plan','cal','diary','set'].forEach(n=>$('#v-'+n).hidden=n!==v); if(v==='today') viewDate=today(); if(v==='diary') renderDiary(true); else render(); enter(v); window.scrollTo(0,0)});
$('#sync').onclick=()=>fState==='need'?reconnectFolder():toast(cloud==='local'&&fState==='on'?'기록이 "'+dirName+'" 폴더의 '+DATA_FILE+'에 저장되고 있어요':cloud==='synced'?'모든 기록이 클라우드에 저장돼 있어요':cloud==='error'?'클라우드에 닿지 않아요. 연결되면 자동으로 다시 저장해요.':cloud==='local'?'기록이 이 기기에만 저장되고 있어요':'클라우드와 맞추는 중이에요');
setCloud('local'); render(); decorate(); enter('today'); setInterval(tick,250); initCloud();
initFolder().then(()=>{ // 기록이 하나도 없는 첫 실행에만 시작 안내를 띄움
  let seen=true; try{seen=!!localStorage.getItem(OB)}catch(e){}
  if(!seen&&!allOf('log-').length&&!allOf('tasks-').length&&!dlg.open) onboard(0)});
})();
</script>
